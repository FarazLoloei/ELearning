name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: 10.0.x

jobs:
  build-test-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ELearning.sln

      - name: Build
        run: dotnet build ELearning.sln --configuration $BUILD_CONFIGURATION --no-restore -nologo /p:UseSharedCompilation=false

      - name: Test with coverage
        run: dotnet test ELearning.sln --configuration $BUILD_CONFIGURATION --no-build -nologo /p:UseSharedCompilation=false --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory TestResults/ci

      - name: Dependency vulnerability scan (SCA)
        shell: bash
        run: |
          mkdir -p TestResults/ci
          dotnet list ELearning.sln package --vulnerable --include-transitive > TestResults/ci/dependency-scan.txt
          cat TestResults/ci/dependency-scan.txt
          if grep -qi "has the following vulnerable packages" TestResults/ci/dependency-scan.txt; then
            echo "Vulnerable dependencies detected."
            exit 1
          fi

      - name: Validate API container build
        run: docker build --file ELearning.API/Dockerfile --tag elearning-api-ci:${{ github.sha }} .

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality-artifacts
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/ci/dependency-scan.txt
          if-no-files-found: warn
