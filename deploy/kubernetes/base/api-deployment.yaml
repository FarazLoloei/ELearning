apiVersion: apps/v1
kind: Deployment
metadata:
  name: elearning-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elearning-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elearning-api
        app.kubernetes.io/part-of: elearning-platform
    spec:
      containers:
        - name: api
          image: elearning-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: elearning-api-config
            - secretRef:
                name: elearning-api-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
